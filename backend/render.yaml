services:
  - type: web
    name: meetslot-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SEED_SECRET
        sync: false
      - key: MASTER_ADMIN_USERNAME
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: ADVISOR_SEED_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
